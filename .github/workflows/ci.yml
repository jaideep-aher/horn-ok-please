name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Devanagari shaping and OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y libraqm0 tesseract-ocr tesseract-ocr-eng tesseract-ocr-hin tesseract-ocr-mar
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests eval poster
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src --max-warnings 0
